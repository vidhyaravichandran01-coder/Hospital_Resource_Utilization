<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hospital Dashboard Login</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f6f9; display:flex; justify-content:center; align-items:center; height:100vh; }
    .login-box { background:#fff; padding:30px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.1); width:300px; }
    .login-box h2 { text-align:center; margin-bottom:20px; }
    .login-box input { width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:4px; }
    .login-box button { width:100%; padding:10px; background:#007bff; color:white; border:none; border-radius:4px; cursor:pointer; }
    .login-box button:hover { background:#0056b3; }
    .message { margin-top:15px; text-align:center; font-weight:bold; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Hospital Dashboard Login</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <div class="message" id="message"></div>
  </div>

  <script>
    function login() {
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value.trim();
      const message = document.getElementById("message");

      const users = { "admin":"admin123", "doctor":"doc2026", "nurse":"nurse@123" };

      if (users[user] && users[user] === pass) {
        message.style.color = "green";
        message.textContent = "Login successful! Redirecting...";
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1500);
      } else {
        message.style.color = "red";
        message.textContent = "Invalid credentials. Try again.";
      }
    }
  </script>
</body>
</html>
