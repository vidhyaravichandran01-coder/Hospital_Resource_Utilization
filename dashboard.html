<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hospital Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background:#eef2f7; margin:0; padding:20px; }
    h1 { text-align:center; }
    table { width:80%; margin:20px auto; border-collapse:collapse; }
    th, td { border:1px solid #ccc; padding:10px; text-align:center; }
    th { background:#007bff; color:white; }
  </style>
</head>
<body>
  <h1>Hospital Resource Utilization & Patient Outcomes</h1>
  <table>
    <tr>
      <th>Department</th>
      <th>Bed Occupancy (%)</th>
      <th>ICU Capacity (%)</th>
      <th>Readmission Rate (%)</th>
      <th>Mortality Rate (%)</th>
      <th>Patient Satisfaction (%)</th>
    </tr>
    <tr><td>ICU</td><td>90</td><td>95</td><td>12</td><td>8</td><td>70</td></tr>
    <tr><td>ER</td><td>75</td><td>80</td><td>8</td><td>5</td><td>65</td></tr>
    <tr><td>Ward</td><td>60</td><td>70</td><td>5</td><td>3</td><td>80</td></tr>
    <tr><td>OR</td><td>80</td><td>85</td><td>10</td><td>6</td><td>75</td></tr>
  </table>
</body>
</html>
